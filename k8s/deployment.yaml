# API do serviço OS. Migrations e seed rodam no start; o startupProbe dá tempo para isso.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: os
  labels: { app: os }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: os }
  template:
    metadata:
      labels: { app: os }
      annotations:
        # Prometheus da stack de observabilidade (CARD-42b).
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: os
          image: tech-challenge-os
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: os-config }
          env:
            - name: DB_SENHA
              valueFrom: { secretKeyRef: { name: os-segredos, key: db-senha } }
            # $(DB_SENHA) é expandido pelo Kubernetes a partir da variável acima.
            - name: ConnectionStrings__DefaultConnection
              value: Host=postgres-os;Database=oficina_os;Username=postgres;Password=$(DB_SENHA)
            - name: Jwt__Key
              valueFrom: { secretKeyRef: { name: plataforma-segredos, key: jwt-key } }
            - name: RabbitMq__Username
              valueFrom: { secretKeyRef: { name: plataforma-segredos, key: rabbitmq-usuario } }
            - name: RabbitMq__Password
              valueFrom: { secretKeyRef: { name: plataforma-segredos, key: rabbitmq-senha } }
            - name: Seed__SenhaUsuarios
              valueFrom: { secretKeyRef: { name: os-segredos, key: seed-senha } }
            - name: Interno__ApiKey
              valueFrom: { secretKeyRef: { name: os-segredos, key: interno-api-key } }
          startupProbe:
            httpGet: { path: /os/health, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /os/health, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /os/ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
